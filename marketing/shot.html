<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>shot</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #faf7f4; }
  html.dark, html.dark body { background: #141118; }
  #frame { display: block; border: 0; background: transparent; }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const route = q.get("route") || "/";
  const w = parseInt(q.get("w") || "390", 10);
  const h = parseInt(q.get("h") || "844", 10);
  const y = parseInt(q.get("y") || "0", 10);
  const theme = q.get("theme") || "light";
  const clickText = q.get("click") || "";
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  if (theme === "dark") {
    document.documentElement.classList.add("dark");
  }

  async function init() {
    try {
      const res = await fetch("/m/live_demo_seed.json?t=" + Date.now());
      if (res.ok) {
        const seed = await res.json();
        localStorage.setItem("wedding_pb_url", window.location.origin);
        localStorage.setItem("wp.theme", theme);
        localStorage.setItem("pocketbase_auth", JSON.stringify({
          token: seed.token,
          record: seed.user
        }));
        const cachePayload = JSON.stringify(seed.cache);
        localStorage.setItem("wedding_planner_cache_v2", cachePayload);
        if (seed.coupleId) {
          localStorage.setItem("wedding_planner_cache_v2_" + seed.coupleId, cachePayload);
        }
        if (seed.userId) {
          localStorage.setItem("wedding_planner_cache_v2_" + seed.userId, cachePayload);
        }
      }
    } catch (e) {
      console.error("Failed loading seed:", e);
    }

    const f = document.createElement("iframe");
    f.id = "frame";
    f.width = w;
    f.height = h;
    f.style.width = w + "px";
    f.style.height = h + "px";

    if (w > 900) {
      document.documentElement.style.overflow = "visible";
      document.body.style.overflow = "visible";
      document.body.style.width = w + "px";
      document.documentElement.style.width = w + "px";
    }
    document.body.appendChild(f);

    f.onload = async () => {
      try {
        await sleep(1400);
        const win = f.contentWindow;
        const doc = f.contentDocument;
        if (clickText) {
          const btns = Array.from(doc.querySelectorAll("button, a, [role='tab']"));
          const target = btns.find(b => (b.innerText || "").trim().toLowerCase().includes(clickText.toLowerCase()));
          if (target) {
            target.click();
            await sleep(700);
          }
        }
        if (y) {
          win.scrollTo({ top: y, left: 0, behavior: "instant" });
          const mainEl = doc.querySelector("main");
          if (mainEl) mainEl.scrollTo({ top: y, left: 0, behavior: "instant" });
        }
        await sleep(800);
        document.title = "READY";
      } catch (e) {
        window.__info = { error: String(e) };
        document.title = "ERROR";
      }
    };
    f.src = route;
  }

  init();
</script>
</body>
</html>
