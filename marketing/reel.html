<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300..700&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #faf7f4;
    --ink: #1c1917;
    --stone: #78716c;
    --line: rgba(28, 25, 23, .14);
    --brass: #b08d57;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0c0a09; }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; font-family: "Inter", system-ui, sans-serif;
  }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: var(--canvas); color: var(--ink);
    transform-origin: center center; flex: none;
  }
  /* bingkai tipis */
  #stage::before {
    content: ""; position: absolute; inset: 34px; border: 1px solid var(--line);
    pointer-events: none;
  }
  .glow {
    position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none;
    background: radial-gradient(circle, rgba(176,141,87,.30), rgba(176,141,87,0) 70%);
    width: 720px; height: 720px; left: 50%; top: 240px; transform: translateX(-50%);
  }

  .top {
    position: absolute; left: 88px; right: 88px; top: 74px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 15px; letter-spacing: .22em; text-transform: uppercase; color: var(--stone);
  }
  .mark { display: flex; align-items: center; gap: 14px; }
  .mark img { width: 46px; height: 46px; object-fit: contain; }
  .mark b { font-weight: 600; letter-spacing: .16em; color: var(--ink); font-size: 15px; }

  .kicker {
    position: absolute; left: 88px; top: 168px;
    font-size: 14px; letter-spacing: .26em; text-transform: uppercase; color: var(--brass);
    display: flex; align-items: center; gap: 14px;
  }
  .kicker::before { content: ""; width: 46px; height: 1px; background: var(--brass); opacity: .6; }

  h1 {
    position: absolute; left: 88px; top: 212px; margin: 0;
    font-family: "Bricolage Grotesque", "Inter", sans-serif;
    font-size: 74px; line-height: 1.06; letter-spacing: -.035em; font-weight: 500;
  }
  h1 em { font-family: "Fraunces", Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -.02em; }

  /* telepon */
  .phone {
    position: absolute; top: 452px; left: 50%; transform: translateX(-50%);
    width: 466px; height: 1009px; border-radius: 54px; padding: 11px;
    background: linear-gradient(160deg, #2b2724, #141110 55%, #241f1c);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.09) inset,
      0 46px 90px -30px rgba(28,25,23,.46),
      0 12px 24px -12px rgba(28,25,23,.28);
  }
  .screen {
    position: relative; width: 100%; height: 100%; border-radius: 44px; overflow: hidden;
    background: #efe9e2;
  }
  .screen img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity .55s var(--ease), transform 1.1s var(--ease);
    transform: scale(1.035);
  }
  .screen img.on { opacity: 1; transform: scale(1); }
  .notch {
    position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
    width: 96px; height: 26px; border-radius: 20px; background: #0b0a09; z-index: 3;
  }

  /* keterangan */
  .cap {
    position: absolute; left: 88px; right: 88px; top: 1508px; height: 92px;
  }
  .cap > div {
    position: absolute; inset: 0; opacity: 0; transform: translateY(10px);
    transition: opacity .5s var(--ease), transform .6s var(--ease);
  }
  .cap > div.on { opacity: 1; transform: translateY(0); }
  .cap small {
    display: block; font-size: 13px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--brass); margin-bottom: 12px;
  }
  .cap p { font-size: 27px; line-height: 1.42; color: var(--stone); letter-spacing: -.01em; }
  .cap p b { color: var(--ink); font-weight: 600; }

  /* progres */
  .bars {
    position: absolute; left: 88px; right: 88px; top: 1642px;
    display: flex; gap: 10px;
  }
  .bars i {
    position: relative; flex: 1; height: 3px; border-radius: 3px;
    background: rgba(28,25,23,.12); overflow: hidden;
  }
  .bars i u {
    position: absolute; inset: 0; display: block; transform-origin: left center;
    transform: scaleX(0); background: var(--ink);
  }
  .bars i.on u { animation: grow var(--dur) linear forwards; }
  .bars i.done u { transform: scaleX(1); }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  .foot {
    position: absolute; left: 88px; right: 88px; top: 1704px;
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: 15px; color: var(--stone); letter-spacing: .02em;
  }
  .foot b {
    font-family: "Fraunces", Georgia, serif; font-style: italic; font-weight: 400;
    font-size: 30px; color: var(--ink); letter-spacing: -.01em;
  }

  /* kontrol (tidak ikut terekam kalau di luar stage) */
  .hint {
    position: fixed; bottom: 18px; right: 22px; font-size: 12px; color: #57534e;
    font-family: "Inter", sans-serif; letter-spacing: .04em;
  }
</style>
</head>
<body>
<div id="stage">
  <div class="glow"></div>

  <div class="top">
    <span class="mark"><img src="/logo-transparent.png" alt=""><b>Wedding Planner</b></span>
    <span>Demo</span>
  </div>

  <div class="kicker">Tur singkat</div>
  <h1>Rencana nikah,<br><em>satu tempat.</em></h1>

  <div class="phone">
    <div class="screen" id="screen"></div>
    <div class="notch"></div>
  </div>

  <div class="cap" id="cap"></div>
  <div class="bars" id="bars"></div>

  <div class="foot">
    <span>Data contoh, bisa diutak-atik</span>
    <b>DM “DEMO” untuk akses</b>
  </div>
</div>
<div class="hint">Rekam area 9:16 ini (Win + Alt + R)</div>

<script>
(function () {
  const Q = new URLSearchParams(location.search);
  const DUR = 3400;

  const frames = [
    { img: "m-dashboard",  label: "01 — Dasbor",    text: "<b>Hitung mundur, dana terkumpul,</b> dan tugas minggu ini." },
    { img: "m-budget",     label: "02 — Anggaran",   text: "<b>CPP, CPW, DP vendor,</b> sisa target tabungan otomatis." },
    { img: "m-guests",     label: "03 — Tamu",       text: "<b>165 tamu</b> dengan circle, prioritas A/B/C, dan status RSVP." },
    { img: "m-vendors",    label: "04 — Vendor",     text: "<b>52 tugas vendor</b> dengan tenggat dan status pembayaran." },
    { img: "m-seserahan",  label: "05 — Seserahan",  text: "<b>Daftar barang, link Shopee,</b> anggaran vs harga aktual." }
  ];

  const screen = document.getElementById("screen");
  const cap = document.getElementById("cap");
  const bars = document.getElementById("bars");

  const imgs = frames.map((f, i) => {
    const el = document.createElement("img");
    el.src = "/m/shots/" + f.img + ".png" + (Q.get("imgv") ? "?v=" + Q.get("imgv") : "");
    el.alt = "";
    screen.appendChild(el);
    return el;
  });

  const caps = frames.map((f) => {
    const d = document.createElement("div");
    d.innerHTML = '<small>' + f.label + '</small><p>' + f.text + '</p>';
    cap.appendChild(d);
    return d;
  });

  const segs = frames.map(() => {
    const i = document.createElement("i");
    i.innerHTML = "<u></u>";
    bars.appendChild(i);
    return i;
  });

  let cur = -1;
  let timer = null;

  function show(n) {
    if (n === cur) return;
    cur = n;
    imgs.forEach((el, i) => el.classList.toggle("on", i === n));
    caps.forEach((el, i) => el.classList.toggle("on", i === n));
    segs.forEach((el, i) => {
      el.classList.remove("on", "done");
      el.querySelector("u").style.transform = "";
      el.style.removeProperty("animation");
      if (i < n) el.classList.add("done");
      if (i === n) { void el.offsetWidth; el.classList.add("on"); }
    });
  }

  if (Q.has("t")) {
    // mode beku untuk pemeriksaan: ?t=4.2 menampilkan detik ke-4,2
    const t = parseFloat(Q.get("t")) || 0;
    const idx = Math.floor(t / (DUR / 1000)) % frames.length;
    show(idx);
    const phase = (t % (DUR / 1000)) / (DUR / 1000);
    const u = segs[idx].querySelector("u");
    segs[idx].classList.remove("on");
    u.style.transform = "scaleX(" + phase.toFixed(3) + ")";
  } else {
    document.documentElement.style.setProperty("--dur", DUR + "ms");
    show(0);
    let i = 0;
    timer = setInterval(() => {
      i = (i + 1) % frames.length;
      show(i);
    }, DUR);
  }

  // skala stage supaya selalu kelihatan utuh di jendela
  function fit() {
    const s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    document.getElementById("stage").style.transform = "scale(" + s + ")";
  }
  fit();
  window.addEventListener("resize", fit);

  window.__qa = () => {
    const r = document.getElementById("stage").getBoundingClientRect();
    const p = document.querySelector(".phone").getBoundingClientRect();
    const c = document.querySelector(".cap").getBoundingClientRect();
    const b = document.querySelector(".bars").getBoundingClientRect();
    const f = document.querySelector(".foot").getBoundingClientRect();
    return {
      frame: [r.width, r.height],
      phone: [Math.round(p.top - r.top), Math.round(p.left - r.left), Math.round(p.width), Math.round(p.height)],
      capTop: Math.round(c.top - r.top),
      barsTop: Math.round(b.top - r.top),
      footTop: Math.round(f.top - r.top),
      active: cur,
      loaded: imgs.every(i => i.complete && i.naturalWidth > 0)
    };
  };

  window.addEventListener("load", () => { document.title = "READY"; });
})();
</script>
</body>
</html>
