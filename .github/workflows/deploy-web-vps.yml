name: Web CI/CD to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/deploy-web-vps.yml'
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Publish the build to the production VPS'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wedding-planner-web-production
  cancel-in-progress: false

jobs:
  build-web:
    name: Lint and build web assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build for the /wedding/ route
        env:
          VITE_PB_URL: ${{ secrets.VITE_PB_URL }}
        run: npm run build -- --base=/wedding/

      - name: Validate built asset paths
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          grep -q '"/wedding/assets/' dist/index.html
          while IFS= read -r asset; do
            test -s "dist/$asset" || {
              echo "Missing built asset: dist/$asset"
              exit 1
            }
          done < <(
            grep -oE '(src|href)="/wedding/assets/[^"]+"' dist/index.html |
              sed -E 's/^(src|href)="([^"]+)"$/\2/' |
              sed 's#^/wedding/##'
          )

      - name: Package web artifact
        run: tar -czf wedding-dist.tar.gz -C dist .

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: wedding-planner-web-dist
          path: wedding-dist.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy-web:
    name: Deploy web assets to VPS
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Download validated web artifact
        uses: actions/download-artifact@v4
        with:
          name: wedding-planner-web-dist
          path: ./web-artifact

      - name: Configure SSH and deploy with rollback protection
        if: ${{ github.event_name == 'push' || inputs.deploy_production }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [[ -z "$VPS_HOST" || -z "$VPS_USER" || -z "$VPS_KEY" || -z "$VPS_SSH_KNOWN_HOSTS" ]]; then
            {
              echo "### Web deployment not performed"
              echo "The build passed, but VPS deployment was skipped because one or more required GitHub Actions secrets are missing."
              echo "Required: `VPS_HOST`, `VPS_USERNAME`, `VPS_SSH_KEY`, `VPS_SSH_KNOWN_HOSTS`. Optional: `VPS_PORT` (defaults to 22)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Build artifact is ready; configure the VPS secrets to enable deployment."
            exit 0
          fi

          if [[ ! "$VPS_PORT" =~ ^[0-9]+$ ]] || (( VPS_PORT < 1 || VPS_PORT > 65535 )); then
            echo "VPS_PORT must be a valid TCP port."
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}"
          ARCHIVE_NAME="wedding-dist-${GITHUB_SHA}-${GITHUB_RUN_ID}.tar.gz"
          cp ./web-artifact/wedding-dist.tar.gz "./$ARCHIVE_NAME"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -P "$VPS_PORT" "./$ARCHIVE_NAME" "$VPS_USER@$VPS_HOST:$ARCHIVE_NAME"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s -- '$RELEASE_ID' '$ARCHIVE_NAME'" <<'REMOTE'
          set -Eeuo pipefail
          release_id="$1"
          archive_name="$2"

          if [[ ! "$release_id" =~ ^[0-9a-f]{40}-[0-9]+$ ]]; then
            echo "Invalid release identifier."
            exit 1
          fi
          if [[ ! "$archive_name" =~ ^wedding-dist-[0-9a-f]{40}-[0-9]+\.tar\.gz$ ]]; then
            echo "Invalid archive name."
            exit 1
          fi

          parent="/srv/www"
          live="$parent/wedding-planner"
          stage="$parent/.wedding-planner-staging-$release_id"
          backup="$parent/.wedding-planner-backup-$release_id"
          archive="$HOME/$archive_name"

          test -d "$parent"
          test -w "$parent" || {
            echo "SSH user cannot write to /srv/www; deployment stopped without changing the live site."
            exit 1
          }
          test -d "$live" && test ! -L "$live" || {
            echo "Expected live path to be an existing real directory; refusing to replace it."
            exit 1
          }
          test -s "$archive"
          test ! -e "$stage"
          test ! -e "$backup"

          mkdir "$stage"
          trap 'status=$?; if [ ! -e "$live" ] && [ -d "$backup" ]; then mv "$backup" "$live"; fi; rm -rf "$stage"; exit "$status"' ERR
          tar -xzf "$archive" -C "$stage"

          test -s "$stage/index.html"
          test -s "$stage/manifest.webmanifest"
          test -s "$stage/sw.js"
          grep -q '"/wedding/assets/' "$stage/index.html"

          mapfile -t asset_refs < <(
            grep -oE '(src|href)="/wedding/assets/[^"]+"' "$stage/index.html" |
              sed -E 's/^(src|href)="([^"]+)"$/\2/' |
              sed 's#^/wedding/##'
          )
          test "${#asset_refs[@]}" -gt 0
          for asset in "${asset_refs[@]}"; do
            test -s "$stage/$asset" || {
              echo "Missing asset in staged release: $asset"
              exit 1
            }
          done

          # Keep the previous live site as a rollback copy.
          mv "$live" "$backup"
          mv "$stage" "$live"
          trap - ERR
          rm -f "$archive"

          echo "Deployment completed."
          echo "Live directory: $live"
          echo "Rollback copy: $backup"
          REMOTE

          {
            echo "### Web deployment completed"
            echo "Release: `$RELEASE_ID`"
            echo "Target: `/srv/www/wedding-planner`"
            echo "The previous frontend is retained in a backup directory on the VPS."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report deployment skipped on manual run
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.deploy_production }}
        run: |
          echo "Manual run built and validated the artifact only. Production deployment was not requested."
