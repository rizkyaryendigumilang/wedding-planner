name: Web CI/CD to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/deploy-web-vps.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/deploy-web-vps.yml'
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Publish the build to the production VPS'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: wedding-planner-web-production
  cancel-in-progress: false

jobs:
  build-web:
    name: Lint, build, and validate web assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build for the /wedding/ route
        env:
          VITE_PB_URL: ${{ secrets.VITE_PB_URL || 'https://43.156.236.102' }}
        run: npm run build -- --base=/wedding/

      - name: Validate built asset paths
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          grep -q '"/wedding/assets/' dist/index.html
          while IFS= read -r asset; do
            test -s "dist/$asset" || {
              echo "Missing built asset: dist/$asset"
              exit 1
            }
          done < <(
            grep -oE '(src|href)="/wedding/assets/[^"]+"' dist/index.html |
              sed -E 's/^(src|href)="([^"]+)"$/\2/' |
              sed 's#^/wedding/##'
          )

      - name: Package web artifact
        run: tar -czf wedding-dist.tar.gz -C dist .

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: wedding-planner-web-dist
          path: wedding-dist.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Log build status and deployment intent
        run: |
          {
            echo "### Web Build & Verification Summary"
            echo "- **Commit SHA:** \`${GITHUB_SHA}\`"
            echo "- **Ref:** \`${GITHUB_REF}\`"
            echo "- **Trigger Event:** \`${GITHUB_EVENT_NAME}\`"
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              echo "- **Production Deployment:** Skipped (Pull requests only execute lint, build, and asset validation)"
            elif [[ "${{ github.event_name }}" == "push" ]]; then
              echo "- **Production Deployment:** Triggered (Automatic deployment on push to \`main\`)"
            elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              if [[ "${{ inputs.deploy_production }}" == "true" ]]; then
                echo "- **Production Deployment:** Triggered (Manual deployment requested with \`deploy_production=true\`)"
              else
                echo "- **Production Deployment:** Skipped (\`deploy_production\` input was false)"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    name: Deploy web assets to VPS
    needs: build-web
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_production == true && github.ref == 'refs/heads/main') }}
    steps:
      - name: Download validated web artifact
        uses: actions/download-artifact@v4
        with:
          name: wedding-planner-web-dist
          path: ./web-artifact

      - name: Validate secrets and deploy to VPS
        id: deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT || secrets.VPS_PORT || '22' }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          # Strict secret validation: missing secrets fail with exit code 1
          missing_secrets=()
          [[ -z "$VPS_HOST" ]] && missing_secrets+=("VPS_HOST")
          [[ -z "$VPS_USER" ]] && missing_secrets+=("VPS_USERNAME")
          [[ -z "$VPS_KEY" ]] && missing_secrets+=("VPS_SSH_KEY")
          [[ -z "$VPS_SSH_KNOWN_HOSTS" ]] && missing_secrets+=("VPS_SSH_KNOWN_HOSTS")

          if (( ${#missing_secrets[@]} > 0 )); then
            echo "::error::Deployment aborted! Required secret(s) missing: ${missing_secrets[*]}"
            {
              echo "### Deployment Failed: Missing Secrets"
              echo "Deployment was requested, but one or more required secrets are not set in GitHub repository settings:"
              for s in "${missing_secrets[@]}"; do
                echo "- \`$s\`"
              done
              echo ""
              echo "Required secrets: \`VPS_HOST\`, \`VPS_USERNAME\`, \`VPS_SSH_KEY\`, \`VPS_SSH_KNOWN_HOSTS\`."
              echo "Optional secrets: \`VPS_SSH_PORT\` or \`VPS_PORT\` (defaults to 22)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ ! "$VPS_PORT" =~ ^[0-9]+$ ]] || (( VPS_PORT < 1 || VPS_PORT > 65535 )); then
            echo "::error::VPS_PORT ($VPS_PORT) must be a valid TCP port between 1 and 65535."
            exit 1
          fi

          # Prepare SSH credentials
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
          ARCHIVE_NAME="wedding-dist-${RELEASE_ID}.tar.gz"
          cp ./web-artifact/wedding-dist.tar.gz "./$ARCHIVE_NAME"

          echo "Uploading release archive $ARCHIVE_NAME to $VPS_USER@$VPS_HOST ..."
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/deploy_key" -P "$VPS_PORT" "./$ARCHIVE_NAME" "$VPS_USER@$VPS_HOST:$ARCHIVE_NAME"

          echo "Applying release on VPS with staged swap and staging validation..."
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s -- '$RELEASE_ID' '$ARCHIVE_NAME'" <<'REMOTE'
          set -Eeuo pipefail
          release_id="$1"
          archive_name="$2"

          if [[ ! "$release_id" =~ ^[0-9a-f]{40}-[0-9]+(-[0-9]+)?$ ]]; then
            echo "Invalid release identifier format."
            exit 1
          fi
          if [[ ! "$archive_name" =~ ^wedding-dist-[0-9a-f]{40}-[0-9]+(-[0-9]+)?\.tar\.gz$ ]]; then
            echo "Invalid archive name format."
            exit 1
          fi

          parent="/srv/www"
          live="$parent/wedding-planner"
          stage="$parent/.wedding-planner-staging-$release_id"
          backup="$parent/.wedding-planner-backup-$release_id"
          archive="$HOME/$archive_name"

          test -d "$parent" || {
            echo "Parent directory $parent does not exist."
            exit 1
          }
          test -w "$parent" || {
            echo "SSH user cannot write to $parent; deployment stopped without touching the live site."
            exit 1
          }
          test -d "$live" && test ! -L "$live" || {
            echo "Expected live path $live to be an existing directory; refusing to proceed."
            exit 1
          }
          test -s "$archive" || {
            echo "Uploaded archive $archive is missing or empty."
            exit 1
          }

          # Pre-flight check: Prevent re-run collision and directory corruption
          if [ -e "$backup" ]; then
            echo "::error::Release ID collision: Backup directory $backup already exists on VPS!"
            echo "::error::Refusing to proceed to prevent overwriting rollback backup or nesting directories."
            exit 1
          fi
          if [ -e "$stage" ]; then
            echo "::error::Staging directory $stage already exists on VPS from a previous attempt!"
            echo "::error::Refusing to proceed to prevent using corrupted staging data."
            exit 1
          fi

          mkdir -m 755 "$stage"

          cleanup_on_failure() {
            local exit_code=$?
            trap - EXIT HUP INT TERM ERR
            if [ "$exit_code" -ne 0 ]; then
              echo "Remote deployment encountered an error (exit code $exit_code). Checking state..."
              if [ ! -e "$live" ] && [ -d "$backup" ]; then
                echo "Restoring previous live release from $backup to $live..."
                mv "$backup" "$live" || echo "::error::CRITICAL: Failed to restore $backup to $live!"
              fi
              [ -d "$stage" ] && rm -rf "$stage"
              [ -f "$archive" ] && rm -f "$archive"
            fi
            exit "$exit_code"
          }
          trap cleanup_on_failure EXIT HUP INT TERM ERR

          tar -xzf "$archive" -C "$stage"
          chmod -R u+rwX,go+rX "$stage"

          # Verify critical stage files before swapping
          test -s "$stage/index.html"
          test -s "$stage/manifest.webmanifest"
          test -s "$stage/sw.js"
          grep -q '"/wedding/assets/' "$stage/index.html"

          mapfile -t asset_refs < <(
            grep -oE '(src|href)="/wedding/assets/[^"]+"' "$stage/index.html" |
              sed -E 's/^(src|href)="([^"]+)"$/\2/' |
              sed 's#^/wedding/##'
          )
          test "${#asset_refs[@]}" -gt 0
          for asset in "${asset_refs[@]}"; do
            test -s "$stage/$asset" || {
              echo "Missing asset in staged release: $asset"
              exit 1
            }
          done

          # Staged release swap: move live to backup, then activate stage
          echo "Backing up existing live deployment to $backup..."
          if ! mv "$live" "$backup"; then
            echo "::error::CRITICAL: Failed to move live directory to $backup! Aborting swap."
            exit 1
          fi

          if [ -e "$live" ]; then
            echo "::error::CRITICAL: Live directory $live still exists after moving to backup! Aborting swap."
            exit 1
          fi

          echo "Activating staged release to $live..."
          if ! mv "$stage" "$live"; then
            echo "::error::CRITICAL: Failed to activate stage to $live! Restoring backup..."
            if [ -d "$backup" ] && [ ! -e "$live" ]; then
              mv "$backup" "$live" || echo "::error::CRITICAL: Failed to restore $backup to $live!"
            fi
            exit 1
          fi

          # Sanity check: $live MUST exist and contain index.html
          if [ ! -d "$live" ] || [ ! -s "$live/index.html" ]; then
            echo "::error::CRITICAL: Activated live directory $live is invalid or missing index.html! Recovering backup..."
            [ -d "$live" ] && mv "$live" "$parent/.wedding-planner-failed-$release_id"
            if [ -d "$backup" ] && [ ! -e "$live" ]; then
              mv "$backup" "$live" || echo "::error::CRITICAL: Failed to restore $backup to $live!"
            fi
            exit 1
          fi

          # Release swap completed successfully; disarm failure trap
          trap - EXIT HUP INT TERM ERR

          # Non-fatal archive cleanup: failure to remove temporary archive does not skip health check
          if ! rm -f "$archive"; then
            echo "::warning::Failed to remove uploaded archive $archive. Manual cleanup may be required."
          fi

          # NOTE: Old backups are NOT pruned here. Backup is strictly preserved until health checks pass.
          echo "Staged release swap completed successfully."
          echo "Live directory: $live"
          echo "Rollback directory: $backup"
          REMOTE

      - name: Verify live deployment health check (Frontend & API)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT || secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
          FRONTEND_URL="https://${VPS_HOST}/wedding/"
          API_HEALTH_URL="https://${VPS_HOST}/wedding-api/health"

          echo "Starting dual health check with strict TLS verification..."

          rollback_release() {
            local err_msg="$1"
            echo "::error::$err_msg"
            echo "Triggering automatic rollback on VPS..."
            local rollback_status=0
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s -- '$RELEASE_ID'" <<'REMOTE_ROLLBACK'
              set -euo pipefail
              release_id="$1"
              parent='/srv/www'
              live="$parent/wedding-planner"
              backup="$parent/.wedding-planner-backup-$release_id"
              failed="$parent/.wedding-planner-failed-$release_id"

              if [ ! -d "$backup" ]; then
                echo "::error::CRITICAL: Rollback backup directory not found at $backup!"
                echo "::error::Preserving live site as-is. Check VPS /srv/www for available backups."
                exit 1
              fi

              echo "Restoring previous release from $backup to $live..."
              if [ -d "$live" ]; then
                if ! mv "$live" "$failed"; then
                  echo "::error::CRITICAL: Failed to move current live directory to $failed! Preserving $backup and stopping."
                  exit 1
                fi
              fi

              if ! mv "$backup" "$live"; then
                echo "::error::CRITICAL: Failed to restore $backup to $live! Attempting recovery..."
                [ -d "$failed" ] && mv "$failed" "$live"
                echo "::error::CRITICAL: Manual recovery required. Check backup at $backup and failed snapshot at $failed."
                exit 1
              fi

              # Verify restored live directory has valid index.html
              if [ -d "$live" ] && [ -s "$live/index.html" ]; then
                echo 'Rollback successfully completed and verified.'
              else
                echo "::error::CRITICAL: Restored directory $live failed post-rollback verification (index.html missing or empty)!"
                echo "::error::Snapshot of faulty live was saved at $failed. Backup source was $backup."
                exit 1
              fi
          REMOTE_ROLLBACK
            then
              {
                echo "### Deployment Failed & Rolled Back"
                echo "- **Error:** $err_msg"
                echo "- **Rollback Status:** Successfully restored and verified previous release on VPS."
                echo "- **Faulty Release Snapshot:** Preserved at \`/srv/www/.wedding-planner-failed-${RELEASE_ID}\`."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              rollback_status=$?
              echo "::error::Automatic rollback on VPS failed with exit code $rollback_status!"
              {
                echo "### Deployment Failed & Rollback FAILED"
                echo "- **Error:** $err_msg"
                echo "- **Rollback Status:** CRITICAL: Automatic rollback failed on VPS (exit code $rollback_status). Immediate manual investigation required!"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          }

          echo "1. Checking Frontend URL: $FRONTEND_URL"
          frontend_ok=false
          frontend_last_err=""
          for i in {1..6}; do
            curl_output=""
            if curl_output=$(curl -fsS --max-time 10 -w "\nHTTP_STATUS:%{http_code}" "$FRONTEND_URL" 2>&1); then
              status_code=$(echo "$curl_output" | grep -oE 'HTTP_STATUS:[0-9]+' | cut -d: -f2 || true)
              frontend_body=$(echo "$curl_output" | sed -E 's/HTTP_STATUS:[0-9]+$//')
              if [ "$status_code" = "200" ] && echo "$frontend_body" | grep -q 'id="root"' && echo "$frontend_body" | grep -qi 'Wedding Planner'; then
                echo "Frontend health check passed (attempt $i, HTTP $status_code)."
                frontend_ok=true
                break
              else
                frontend_last_err="HTTP $status_code response invalid (expected HTTP 200 with id='root' and title 'Wedding Planner')."
              fi
            else
              curl_exit=$?
              frontend_last_err="Network/HTTP request failed (curl exit $curl_exit)."
            fi
            echo "Waiting for frontend to respond with valid HTML (attempt $i/6)..."
            sleep 5
          done

          if [ "$frontend_ok" != "true" ]; then
            rollback_release "Frontend health check failed at $FRONTEND_URL after 6 attempts. Last error: $frontend_last_err"
          fi

          echo "2. Checking PocketBase API URL: $API_HEALTH_URL"
          api_ok=false
          api_last_err=""
          for i in {1..6}; do
            curl_output=""
            if curl_output=$(curl -fsS --max-time 10 -w "\nHTTP_STATUS:%{http_code}" "$API_HEALTH_URL" 2>&1); then
              status_code=$(echo "$curl_output" | grep -oE 'HTTP_STATUS:[0-9]+' | cut -d: -f2 || true)
              api_body=$(echo "$curl_output" | sed -E 's/HTTP_STATUS:[0-9]+$//')
              # Check HTTP 200, JSON code 200, and message "API is healthy"
              if [ "$status_code" = "200" ] && echo "$api_body" | grep -qE '"code"[[:space:]]*:[[:space:]]*200' && echo "$api_body" | grep -qi 'API is healthy'; then
                echo "PocketBase API health check passed (attempt $i, HTTP $status_code)."
                api_ok=true
                break
              else
                api_last_err="HTTP $status_code response invalid (expected HTTP 200, JSON code:200, and healthy message)."
              fi
            else
              curl_exit=$?
              api_last_err="API request failed (curl exit $curl_exit)."
            fi
            echo "Waiting for API to respond healthy (attempt $i/6)..."
            sleep 5
          done

          if [ "$api_ok" != "true" ]; then
            rollback_release "PocketBase API health check failed at $API_HEALTH_URL after 6 attempts. Last error: $api_last_err"
          fi

          echo "All health checks passed successfully!"

          # Housekeeping: Prune older backups only after health checks have fully succeeded.
          # Retains the 5 most recent backups and explicitly preserves the active release backup.
          # Housekeeping failure emits a warning and does NOT fail an already healthy deployment.
          echo "Pruning older backups while preserving the active release backup..."
          if ! ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s -- '$RELEASE_ID'" <<'REMOTE_PRUNE'
            set -euo pipefail
            release_id="$1"
            parent='/srv/www'
            active_backup="$parent/.wedding-planner-backup-$release_id"
            mapfile -t old_backups < <(ls -dt "$parent"/.wedding-planner-backup-* 2>/dev/null | tail -n +6 || true)
            for b in "${old_backups[@]:-}"; do
              if [ -n "$b" ] && [ "$b" != "$active_backup" ] && [ -d "$b" ]; then
                echo "Pruning old backup: $b"
                rm -rf "$b"
              fi
            done
          REMOTE_PRUNE
          then
            echo "::warning::Backup housekeeping encountered an issue. Live release is active and verified healthy."
          fi

          {
            echo "### Web Deployment Succeeded"
            echo "- **Commit SHA:** \`${GITHUB_SHA}\`"
            echo "- **Release ID:** \`${RELEASE_ID}\`"
            echo "- **Live Destination:** \`/srv/www/wedding-planner\`"
            echo "- **Frontend URL:** \`$FRONTEND_URL\` (Verified HTML & root element via strict TLS)"
            echo "- **PocketBase API:** \`$API_HEALTH_URL\` (Verified HTTP 200 code & health message via strict TLS)"
            echo "- **Rollback Snapshot:** Retained on VPS at \`/srv/www/.wedding-planner-backup-${RELEASE_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
