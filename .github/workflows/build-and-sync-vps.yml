name: Build & Release Mobile Apps (APK & IPA)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - 'marketing/**'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag Versi Rilis (misal: v1.0.0). Kosongkan untuk membaca versi otomatis dari package.json'
        required: false
        default: ''
      release_title:
        description: 'Judul Rilis (misal: Wedding Planner v1.0.0 — Rilis Perdana & Perbaikan Bug)'
        required: false
        default: ''
      release_notes:
        description: 'Keterangan Perbaikan Bug / Changelog Rilis'
        required: false
        default: ''
      is_prerelease:
        description: 'Tandai sebagai Pre-release (Beta)?'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build mobile web assets
        env:
          VITE_PB_URL: ${{ secrets.VITE_PB_URL }}
        run: npm run build -- --base=/

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Compile APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK file
        run: |
          set -euo pipefail
          APK_PATH="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "Error: Debug APK was not found."
            exit 1
          fi
          cp "$APK_PATH" app-latest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-latest-android-apk
          path: app-latest.apk
          if-no-files-found: error
          retention-days: 14

      - name: Send APK to VPS via SCP (optional)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_TARGET_DIR: ${{ secrets.VPS_TARGET_DIR }}
          VPS_PORT: ${{ secrets.VPS_PORT || '2222' }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" || -z "$VPS_KEY" || -z "$VPS_TARGET_DIR" || -z "$VPS_SSH_KNOWN_HOSTS" ]]; then
            echo "::notice::VPS upload skipped. Configure VPS_HOST, VPS_USERNAME, VPS_SSH_KEY, VPS_TARGET_DIR and VPS_SSH_KNOWN_HOSTS to enable it."
            exit 0
          fi
          if [[ ! "$VPS_TARGET_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "VPS_TARGET_DIR must be an absolute path containing only letters, numbers, dots, underscores, slashes or hyphens."
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p -- '$VPS_TARGET_DIR'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -P "$VPS_PORT" app-latest.apk "$VPS_USER@$VPS_HOST:$VPS_TARGET_DIR/app-latest.apk"
          echo "APK uploaded successfully."

  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build mobile web assets
        env:
          VITE_PB_URL: ${{ secrets.VITE_PB_URL }}
        run: npm run build -- --base=/

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Archive Xcode project (unsigned)
        run: |
          set -euo pipefail
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild clean archive \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE_SPECIFIER=""
          else
            xcodebuild clean archive \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE_SPECIFIER=""
          fi

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH=""
          for candidate in ios/App/build/App.xcarchive/Products/Applications/*.app; do
            if [ -d "$candidate" ]; then
              APP_PATH="$candidate"
              break
            fi
          done
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app bundle was not found in the archive."
            exit 1
          fi
          TEMP_PAYLOAD="$(mktemp -d)"
          trap 'rm -rf "$TEMP_PAYLOAD"' EXIT
          mkdir -p "$TEMP_PAYLOAD/Payload"
          cp -R "$APP_PATH" "$TEMP_PAYLOAD/Payload/"
          (cd "$TEMP_PAYLOAD" && zip -qr -y "$GITHUB_WORKSPACE/app-latest.ipa" Payload)

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-latest-ios-ipa-unsigned
          path: app-latest.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Send unsigned IPA to VPS via SCP (optional)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_TARGET_DIR: ${{ secrets.VPS_TARGET_DIR }}
          VPS_PORT: ${{ secrets.VPS_PORT || '2222' }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" || -z "$VPS_KEY" || -z "$VPS_TARGET_DIR" || -z "$VPS_SSH_KNOWN_HOSTS" ]]; then
            echo "::notice::VPS upload skipped. Configure VPS_HOST, VPS_USERNAME, VPS_SSH_KEY, VPS_TARGET_DIR and VPS_SSH_KNOWN_HOSTS to enable it."
            exit 0
          fi
          if [[ ! "$VPS_TARGET_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "VPS_TARGET_DIR must be an absolute path containing only letters, numbers, dots, underscores, slashes or hyphens."
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p -- '$VPS_TARGET_DIR'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -P "$VPS_PORT" app-latest.ipa "$VPS_USER@$VPS_HOST:$VPS_TARGET_DIR/app-latest.ipa"
          echo "Unsigned IPA uploaded successfully. It is not signed for normal iPhone installation."

  publish-release:
    name: Publish GitHub Release (APK & IPA)
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: app-latest-android-apk
          path: release-assets

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: app-latest-ios-ipa-unsigned
          path: release-assets

      - name: Determine Version & Prepare Release Files
        id: prep
        run: |
          set -euo pipefail

          # 1. Baca versi dari package.json
          PKG_VERSION="$(node -p "require('./package.json').version || '1.0.0'")"

          # 2. Tentukan release tag
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
            RAW_VERSION="${RELEASE_TAG#v}"
          elif [[ -n "${{ github.event.inputs.tag_name }}" ]]; then
            RELEASE_TAG="${{ github.event.inputs.tag_name }}"
            RAW_VERSION="${RELEASE_TAG#v}"
          else
            RELEASE_TAG="v${PKG_VERSION}"
            RAW_VERSION="${PKG_VERSION}"
          fi

          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RAW_VERSION}" >> "$GITHUB_OUTPUT"

          # 3. Tentukan Judul Rilis
          if [[ -n "${{ github.event.inputs.release_title }}" ]]; then
            RELEASE_TITLE="${{ github.event.inputs.release_title }}"
          else
            RELEASE_TITLE="Wedding Planner Mobile ${RELEASE_TAG}"
          fi
          echo "title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

          # 4. Salin berkas dengan penamaan versi yang terstandarisasi
          cd release-assets
          cp app-latest.apk "wedding-planner-${RELEASE_TAG}.apk"
          cp app-latest.ipa "wedding-planner-${RELEASE_TAG}-unsigned.ipa"

          # 5. Buat Checksum SHA256 untuk verifikasi integritas berkas
          sha256sum "wedding-planner-${RELEASE_TAG}.apk" "wedding-planner-${RELEASE_TAG}-unsigned.ipa" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Generate Changelog & Release Notes
        id: notes
        run: |
          set -euo pipefail

          TAG="${{ steps.prep.outputs.tag }}"
          NOTES_FILE="$RUNNER_TEMP/release_notes.md"

          cat << 'EOF' > "$NOTES_FILE"
          ## 📱 Rilis Aplikasi Mobile Wedding Planner

          Paket aplikasi mobile resmi siap unduh untuk Android (`.apk`) dan iOS (`.ipa`).

          ### 📦 Berkas Unduhan
          | Platform | Nama Berkas | Keterangan |
          |---|---|---|
          | 🤖 **Android** | `wedding-planner-TAG.apk` | Siap diinstal langsung di smartphone & tablet Android |
          | 🍎 **iOS** | `wedding-planner-TAG-unsigned.ipa` | Paket IPA iOS (Unsigned / Sideloading) |
          | 🔒 **Verifikasi** | `SHA256SUMS.txt` | Checksum integritas berkas SHA256 |

          EOF

          sed -i "s/TAG/${TAG}/g" "$NOTES_FILE"

          # Keterangan Perbaikan Bug / Changelog
          CUSTOM_NOTES="${{ github.event.inputs.release_notes }}"
          if [[ -n "$CUSTOM_NOTES" ]]; then
            echo -e "\n### 🛠️ Keterangan Pembaruan & Perbaikan Bug\n$CUSTOM_NOTES\n" >> "$NOTES_FILE"
          else
            echo -e "\n### 🛠️ Catatan Perubahan Terkini" >> "$NOTES_FILE"
            git log -n 10 --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" >> "$NOTES_FILE"
            echo -e "\n" >> "$NOTES_FILE"
          fi

          cat << 'EOF' >> "$NOTES_FILE"
          ### 💡 Petunjuk Instalasi
          - **Android (`.apk`)**: Unduh berkas `.apk` langsung ke perangkat Android Anda, buka berkas dari pengelola unduhan, dan aktifkan opsi *Izinkan instalasi dari sumber tidak dikenal* bila diminta sistem.
          - **iOS (`.ipa`)**: Berkas `.ipa` belum ditandatangani sertifikat pengembang Apple (*unsigned*). Anda dapat memasangnya pada iPhone/iPad memakai alat bantuan sideloading seperti **AltStore**, **Sideloadly**, atau **TrollStore**.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: ${{ steps.prep.outputs.title }}
          body_path: ${{ runner.temp }}/release_notes.md
          files: |
            release-assets/wedding-planner-*.apk
            release-assets/wedding-planner-*.ipa
            release-assets/SHA256SUMS.txt
          draft: false
          prerelease: ${{ github.event.inputs.is_prerelease == 'true' }}
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
